name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Run the checks
        run: npm run check

      - name: Check the package contents
        run: npm pack --dry-run

      - name: Read the package version
        id: package
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the package version
        run: test "v${{ steps.package.outputs.version }}" = "$GITHUB_REF_NAME"

      - name: Check whether this version is already published
        id: published
        run: |
          if npm view "dsh-web-host-facts@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: no npm token is stored. npm exchanges the GitHub OIDC token for a
      # short-lived publish credential, and --provenance attaches the SLSA attestation.
      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Create the GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
